<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Clon - Gestor de Tareas</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>📋 Trello Clon</h1>
                <p class="subtitle">Gestor de Tareas - FastAPI Edition</p>
            </div>
        </header>

        <main class="main-content">
            <section class="stats-section" id="statsSection">
                <h2>Estadísticas</h2>
                <div class="stats-grid">
                    <div class="stat-card stat-total">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total Tareas</span>
                    </div>
                    <div class="stat-card stat-pending">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pendientes</span>
                    </div>
                    <div class="stat-card stat-progress">
                        <span class="stat-number" id="inProgressTasks">0</span>
                        <span class="stat-label">En Curso</span>
                    </div>
                    <div class="stat-card stat-completed">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Finalizadas</span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    <span class="progress-text" id="progressText">0% completadas</span>
                </div>
            </section>

            <section class="actions-section">
                <button class="btn btn-primary" id="toggleFormBtn">+ Nueva Tarea</button>
                <div class="filter-bar">
                    <input type="text" id="filterResponsable" placeholder="Filtrar por responsable..." class="filter-input">
                    <select id="filterEstado" class="filter-select">
                        <option value="">Todos los estados</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="en_curso">En Curso</option>
                        <option value="finalizada">Finalizada</option>
                    </select>
                    <select id="filterCategoria" class="filter-select">
                        <option value="">Todas las categorías</option>
                    </select>
                    <button class="btn btn-filter" id="applyFilters">Filtrar</button>
                    <button class="btn btn-reset" id="resetFilters">Reset</button>
                </div>
            </section>

            <section class="form-section" id="formSection" style="display:none;">
                <h2>Nueva Tarea</h2>
                <form id="taskForm" class="task-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="formTitulo">Título *</label>
                            <input type="text" id="formTitulo" required maxlength="200" placeholder="Título de la tarea">
                        </div>
                        <div class="form-group">
                            <label for="formPrioridad">Prioridad *</label>
                            <select id="formPrioridad" required>
                                <option value="1">Alta (1)</option>
                                <option value="2">Media (2)</option>
                                <option value="3">Baja (3)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="formDescripcion">Descripción *</label>
                            <textarea id="formDescripcion" required rows="3" placeholder="Descripción detallada..."></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="formCategoria">Categoría *</label>
                            <input type="text" id="formCategoria" required maxlength="100" placeholder="Dev, Frontend, Backend...">
                        </div>
                        <div class="form-group">
                            <label for="formResponsable">Responsable *</label>
                            <input type="text" id="formResponsable" required maxlength="100" placeholder="Nombre del responsable">
                        </div>
                        <div class="form-group">
                            <label for="formFechaLimite">Fecha Límite *</label>
                            <input type="text" id="formFechaLimite" required maxlength="10" placeholder="YYYY-MM-DD">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Crear Tarea</button>
                        <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancelar</button>
                    </div>
                </form>
            </section>

            <section class="tasks-section">
                <h2>Tablero de Tareas</h2>
                <div class="tasks-grid" id="tasksGrid">
                    <div class="empty-state" id="emptyState">
                        <p>📭 No hay tareas aún. ¡Crea una nueva tarea!</p>
                    </div>
                </div>
            </section>
        </main>

        <div class="toast" id="toast"></div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
